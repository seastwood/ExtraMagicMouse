name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0.0"
        required: true
      notes:
        description: "Release notes (optional; replaces the notes if the release already exists)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set version from tag
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Re-running for an existing tag builds that tag, not the branch head.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
          fi
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
      - name: Restore signing identity
        env:
          SIGNING_P12: ${{ secrets.EMM_SIGNING_P12 }}
        run: |
          # The same certificate on every release keeps the Accessibility
          # permission across updates. setup_signing.sh restores it from here.
          if [[ -z "$SIGNING_P12" ]]; then
            echo "::warning::EMM_SIGNING_P12 secret not set: this build gets a one-off certificate, so Accessibility must be granted again after updating."
            exit 0
          fi
          mkdir -p "$HOME/.config/extramagicmouse"
          echo "$SIGNING_P12" | base64 --decode > "$HOME/.config/extramagicmouse/emm-signing.p12"
      - name: Build app
        run: ./scripts/build_app.sh --dmg
      - name: Zip
        run: cd build && ditto -c -k --keepParent "Extra Magic Mouse.app" ExtraMagicMouse.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          DEFAULT_NOTES="Download **ExtraMagicMouse.dmg**, open it, and drag Extra Magic Mouse into Applications. See the README for install steps."
          # A release made by hand on GitHub (which also pushes the tag) gets the
          # built files attached instead of failing the run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/ExtraMagicMouse.dmg build/ExtraMagicMouse.zip --clobber
            if [[ -n "$NOTES" ]]; then gh release edit "$TAG" --notes "$NOTES"; fi
            exit 0
          fi
          gh release create "$TAG" build/ExtraMagicMouse.dmg build/ExtraMagicMouse.zip \
            --target "$GITHUB_SHA" \
            --title "Extra Magic Mouse $TAG" \
            --notes "${NOTES:-$DEFAULT_NOTES}"
